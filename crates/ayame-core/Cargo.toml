[package]
name = "ayame-core"
description = "Memory-mapped, sparsely-indexed engine for editing extremely large text files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
[features]
# Dev-only TypeScript wire declarations consumed by ayame-cli's typegen.
typegen = ["dep:ts-rs"]

[dependencies]
ts-rs = { version = "12", optional = true }
memmap2.workspace = true
memchr.workspace = true
encoding_rs.workspace = true
chardetng.workspace = true
regex.workspace = true
rayon.workspace = true
thiserror.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
unicode-normalization.workspace = true
csv-core = "0.1"

# SIGBUS absorption for mmaps whose backing file may shrink underneath us
# (mapfault.rs). Already in the lockfile via memmap2.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# SHA-256 for the data-integrity checksum harness (tests/common). Already in the
# workspace lockfile via xtask, so this pins no new crates.
sha2.workspace = true

[lints]
workspace = true
