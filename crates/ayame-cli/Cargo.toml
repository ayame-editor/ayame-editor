[package]
name = "ayame-cli"
description = "Ayame command-line tool and local web editor for very large files."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ayame"
path = "src/main.rs"

[dependencies]
ayame-core = { path = "../ayame-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "fs", "io-util"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["catch-panic"] }
