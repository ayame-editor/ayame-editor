[package]
name = "ayame-cli"
description = "Ayame command-line tool and local web editor for very large files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
[[bin]]
name = "ayame"
path = "src/main.rs"

[package.metadata.winres]
ProductName = "Ayame Editor"
FileDescription = "Ayame Editor"
CompanyName = "hjosugi"
LegalCopyright = "Copyright (C) 2026 hjosugi"
InternalName = "ayame"
OriginalFilename = "ayame.exe"

[features]
# Default builds are the standalone, statically-linkable CLI + web server with
# self-update support but no webview dependency. Server-only deployments can
# use --no-default-features to omit the TLS/checksum/archive stack.
default = ["self-update"]
self-update = ["dep:reqwest", "dep:sha2", "dep:zip"]
# The native app checks and installs updates, so gui always carries self-update
# even when a caller combines it with --no-default-features.
gui = ["self-update", "dep:wry", "dep:tao", "dep:muda", "dep:rfd"]
# Dev-only: `ayame typegen` emits web/types/api.d.ts from the serve API types
# via the owner's typeship facade (never enabled in shipped builds).
typegen = ["ayame-core/typegen", "dep:ts-rs", "dep:typeship", "dep:typeship-ts-rs"]

[dependencies]
ts-rs = { version = "12", optional = true }
typeship = { version = "0.2", optional = true }
typeship-ts-rs = { version = "0.2", optional = true }
ayame-core = { path = "../ayame-core" }
anyhow.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "fs", "io-util"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["catch-panic"] }
futures-util = { version = "0.3", default-features = false }
getrandom = "0.3"
regex.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
unicode_names2.workspace = true
unicode-general-category.workspace = true
unicode-script.workspace = true
unicode-bidi.workspace = true
east-asian-width.workspace = true
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }

# Native window (feature = "gui"): the OS webview (WKWebView / WebView2 /
# WebKitGTK), not a bundled browser. Optional so it never touches CLI builds.
wry = { version = "0.52", optional = true }
tao = { version = "0.34", optional = true }
# OS-native open/save dialogs for the gui build (IFileDialog / NSSavePanel /
# GTK). The web serve build keeps its in-page picker instead.
rfd = { version = "0.15", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Native menu bar, macOS only: WKWebView swallows Cmd+C/V/X/A unless real
# NSMenu items carry those key equivalents. Windows/Linux use the in-page
# menubar instead, so the dependency exists solely on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19", optional = true }

# Build-time only: the TypeScript sources under web/src are type-stripped to
# plain ES modules by build.rs using the oxc toolchain (Rust-native, no Node in
# the shipped build). The transformed JS is embedded via include_str! — see
# build.rs and src/serve/assets.rs. tsc is only a CI type gate, never a runtime
# or release-build dependency.
[build-dependencies]
serde_json.workspace = true
oxc_allocator = "0.138"
oxc_parser = "0.138"
oxc_span = "0.138"
oxc_semantic = "0.138"
oxc_transformer = "0.138"
# build.rs emits code only; source maps would compile an unused dependency.
oxc_codegen = { version = "0.138", default-features = false }
winres = "0.1.12"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
