<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FBF8F1" />
    <title>Ayame Editor</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <svg class="icon-sprite" width="0" height="0" aria-hidden="true" focusable="false">
      <symbol id="i-sidebar" viewBox="0 0 24 24">
        <rect x="4" y="4.5" width="16" height="15" rx="2" />
        <path d="M9 4.5v15" />
        <path d="M11.8 15.5v-4.2c0-.5.3-.8.8-.8h2.2l.8 1h3.1c.5 0 .8.3.8.8v3.2h-7.7Z" />
      </symbol>
      <symbol id="i-undo" viewBox="0 0 24 24">
        <path d="M9 8H5V4" />
        <path d="M5.4 8.3a8 8 0 1 1 2.1 8.1" />
      </symbol>
      <symbol id="i-redo" viewBox="0 0 24 24">
        <path d="M15 8h4V4" />
        <path d="M18.6 8.3a8 8 0 1 0-2.1 8.1" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="5.8" />
        <path d="m15 15 4.5 4.5" />
      </symbol>
      <symbol id="i-up" viewBox="0 0 24 24">
        <path d="M12 19V5M6.5 10.5 12 5l5.5 5.5" />
      </symbol>
      <symbol id="i-down" viewBox="0 0 24 24">
        <path d="M12 5v14M6.5 13.5 12 19l5.5-5.5" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="i-folder-up" viewBox="0 0 24 24">
        <path d="M3.8 18.5V7.2c0-.8.5-1.3 1.3-1.3h5l1.8 2.1h6.9c.8 0 1.3.5 1.3 1.3v9.2H3.8Z" />
        <path d="M12 17v-6M9.5 13.5 12 11l2.5 2.5" />
      </symbol>
      <symbol id="i-tools" viewBox="0 0 24 24">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
      </symbol>
    </svg>
    <div id="app">
      <nav id="menubar" role="menubar" aria-label="メニュー">
        <div class="menu-shell">
          <button id="file-menu-button" class="menubar-button" role="menuitem" aria-haspopup="true" aria-expanded="false">
            ファイル
          </button>
          <div id="file-menu" class="file-menu hidden" role="menu" aria-label="ファイル">
            <button id="new-file" class="menu-item" role="menuitem">
              <span class="menu-label">新規ファイル</span><span class="menu-key" data-key-action="newFile">Ctrl+N</span>
            </button>
            <button id="open-file" class="menu-item" role="menuitem">
              <span class="menu-label">開く</span><span class="menu-key" data-key-action="openFile">Ctrl+O</span>
            </button>
            <div class="menu-sep" aria-hidden="true"></div>
            <button id="save-file" class="menu-item" role="menuitem">
              <span class="menu-label">保存</span><span class="menu-key" data-key-action="saveFile">Ctrl+S</span>
            </button>
            <button id="save-copy" class="menu-item" role="menuitem">
              <span class="menu-label">名前を付けて保存</span><span class="menu-key" data-key-action="saveAs">Ctrl+Shift+S</span>
            </button>
          </div>
        </div>
        <div class="menu-shell">
          <button id="edit-menu-button" class="menubar-button" role="menuitem" aria-haspopup="true" aria-expanded="false">編集</button>
          <div id="edit-menu" class="file-menu hidden" role="menu" aria-label="編集">
            <button class="menu-item" data-menu-action="undo" role="menuitem"><span class="menu-label">元に戻す</span><span class="menu-key" data-key-action="undo">Ctrl+Z</span></button>
            <button class="menu-item" data-menu-action="redo" role="menuitem"><span class="menu-label">やり直す</span><span class="menu-key" data-key-action="redo">Ctrl+Y</span></button>
            <div class="menu-sep" aria-hidden="true"></div>
            <button class="menu-item" data-menu-action="find" role="menuitem"><span class="menu-label">検索</span><span class="menu-key" data-key-action="find">Ctrl+F</span></button>
            <button class="menu-item" data-menu-action="replace" role="menuitem"><span class="menu-label">置換</span><span class="menu-key" data-key-action="replace">Ctrl+H</span></button>
            <button class="menu-item" data-menu-action="gotoLine" role="menuitem"><span class="menu-label">行へ移動</span><span class="menu-key" data-key-action="gotoLine">Ctrl+G</span></button>
          </div>
        </div>
        <div class="menu-shell">
          <button id="selection-menu-button" class="menubar-button" role="menuitem" aria-haspopup="true" aria-expanded="false">選択</button>
          <div id="selection-menu" class="file-menu hidden" role="menu" aria-label="選択">
            <button class="menu-item" data-menu-action="selectAll" role="menuitem"><span class="menu-label">すべて選択</span><span class="menu-key" data-key-action="selectAll">Ctrl+A</span></button>
            <button class="menu-item" data-menu-action="selectNextOccurrence" role="menuitem"><span class="menu-label">次の一致を選択</span><span class="menu-key" data-key-action="selectNextOccurrence">Ctrl+D</span></button>
            <button class="menu-item" data-menu-action="copy" role="menuitem"><span class="menu-label">コピー</span><span class="menu-key" data-key-action="copy">Ctrl+C</span></button>
            <button class="menu-item" data-menu-action="cut" role="menuitem"><span class="menu-label">切り取り</span><span class="menu-key" data-key-action="cut">Ctrl+X</span></button>
            <div class="menu-sep" aria-hidden="true"></div>
            <button class="menu-item" data-menu-action="caseUpper" role="menuitem"><span class="menu-label">大文字に変換</span><span class="menu-key" data-key-action="caseUpper"></span></button>
            <button class="menu-item" data-menu-action="caseLower" role="menuitem"><span class="menu-label">小文字に変換</span><span class="menu-key" data-key-action="caseLower"></span></button>
            <div class="menu-sep" aria-hidden="true"></div>
            <button class="menu-item" data-menu-action="addCursorAbove" role="menuitem"><span class="menu-label">カーソルを上に追加</span><span class="menu-key" data-key-action="addCursorAbove">Ctrl+Alt+↑</span></button>
            <button class="menu-item" data-menu-action="addCursorBelow" role="menuitem"><span class="menu-label">カーソルを下に追加</span><span class="menu-key" data-key-action="addCursorBelow">Ctrl+Alt+↓</span></button>
          </div>
        </div>
        <div class="menu-shell">
          <button id="view-menu-button" class="menubar-button" role="menuitem" aria-haspopup="true" aria-expanded="false">表示</button>
          <div id="view-menu" class="file-menu hidden" role="menu" aria-label="表示">
            <button class="menu-item" data-menu-action="toggleSidebar" role="menuitem"><span class="menu-label">エクスプローラー</span><span class="menu-key" data-key-action="toggleSidebar">Ctrl+B</span></button>
            <button class="menu-item" data-menu-action="find" role="menuitem"><span class="menu-label">検索バー</span><span class="menu-key" data-key-action="find">Ctrl+F</span></button>
            <button class="menu-item" data-menu-action="commandPalette" role="menuitem"><span class="menu-label">コマンドパレット</span><span class="menu-key" data-key-action="commandPalette">Ctrl+Shift+P</span></button>
            <div class="menu-sep" aria-hidden="true"></div>
            <button class="menu-item" data-menu-action="settings" role="menuitem"><span class="menu-label">設定</span><span class="menu-key" data-key-action="settings"></span></button>
          </div>
        </div>
      </nav>
      <!-- Toolbar stays minimal by design: explorer open/close, undo/redo, and
           the ツール dropdown (sort / replace / diff / case live there). Search
           floats inside the editor viewport instead. -->
      <header id="toolbar">
        <div class="tb-group">
          <button id="toggle-sidebar" class="ico" title="エクスプローラー (Ctrl+B)" aria-label="エクスプローラー">
            <svg class="ay-icon"><use href="#i-sidebar"></use></svg>
          </button>
          <button id="apply-theme" class="cmd hidden" title="このJSONをテーマとして適用">テーマ適用</button>
          <button id="apply-keymap" class="cmd hidden" title="このJSONをキー設定として適用">キー設定適用</button>
        </div>

        <div class="tb-sep"></div>

        <div class="tb-group">
          <button id="undo-edit" class="ico" title="元に戻す (Ctrl+Z)" aria-label="元に戻す">
            <svg class="ay-icon"><use href="#i-undo"></use></svg>
          </button>
          <button id="redo-edit" class="ico" title="やり直す (Ctrl+Y)" aria-label="やり直す">
            <svg class="ay-icon"><use href="#i-redo"></use></svg>
          </button>
        </div>

        <div class="tb-sep"></div>

        <div class="menu-shell">
          <button id="tools-menu-button" class="cmd" role="menuitem" aria-haspopup="true" aria-expanded="false" title="ソート・差分・分割">
            <svg class="ay-icon"><use href="#i-tools"></use></svg><span class="btn-label">ツール</span>
          </button>
          <div id="tools-menu" class="file-menu hidden" role="menu" aria-label="ツール">
            <button class="menu-item" data-menu-action="sortSave" role="menuitem"
                    title="行単位で並び替えて現在のファイルを上書きします。既定は行全体の文字列比較、キー列を指定するとその列で比較 (昇順/降順)">
              <span class="menu-label">ソート</span><span class="menu-key" data-key-action="sortSave"></span>
            </button>
            <button class="menu-item" data-menu-action="diffFile" role="menuitem"><span class="menu-label">2ファイル差分</span><span class="menu-key" data-key-action="diffFile"></span></button>
            <button class="menu-item" data-menu-action="splitFile" role="menuitem"
                    title="行数を指定して複数ファイルに分割します (例: 100万行ずつ)">
              <span class="menu-label">ファイルを分割</span><span class="menu-key" data-key-action="splitFile"></span>
            </button>
          </div>
        </div>
      </header>

      <nav id="tabbar">
        <div id="tabs"></div>
        <button id="new-tab" class="tab-new" title="新規タブ (Ctrl+N)" aria-label="新規タブ">
          <svg class="ay-icon"><use href="#i-plus"></use></svg>
        </button>
      </nav>

      <div id="main">
        <aside id="sidebar" class="hidden">
          <div class="sb-head">
            <svg class="ay-icon"><use href="#i-sidebar"></use></svg>
            <span class="sb-title">エクスプローラー</span>
            <button id="sb-close" class="ico sb-close" title="エクスプローラーを閉じる" aria-label="エクスプローラーを閉じる">×</button>
          </div>
          <div id="sb-root" class="sb-root" title=""></div>
          <div class="sb-actions" aria-label="エクスプローラー操作">
            <button id="sb-up" class="cmd sb-action" title="上の階層へ">
              <svg class="ay-icon"><use href="#i-folder-up"></use></svg><span class="btn-label">上の階層へ</span>
            </button>
          </div>
          <div id="tree" class="tree"></div>
        </aside>

        <main id="viewport" tabindex="0">
          <div id="ruler"><div id="ruler-inner"></div><div id="ruler-corner"></div></div>
          <!-- faint watercolor iris illustration (opacity = --illus; 0 hides it) -->
          <div id="ambient" aria-hidden="true"></div>
          <div id="content">
            <div id="sel-layer"></div>
            <div id="caret" aria-hidden="true"></div>
            <textarea id="hidden-input" spellcheck="false" autocapitalize="off"
                      autocomplete="off" autocorrect="off" wrap="off"
                      aria-label="エディタ"></textarea>
          </div>
          <div id="vscrollbar"><div id="vticks"></div><div id="vthumb"></div></div>
          <!-- Floating in-editor search & replace (VS Code style): overlays the
               top-right of the viewport so the toolbar stays minimal. -->
          <div class="find-group" role="search" aria-label="検索と置換">
            <div class="field find">
              <button id="find-expand" class="ico find-expand" title="置換を表示 (Ctrl+H)"
                      aria-label="置換を表示" aria-expanded="false"></button>
              <svg class="ay-icon find-mag"><use href="#i-search"></use></svg>
              <input id="find" type="text" autocomplete="off" placeholder="検索 (Ctrl+F)" />
              <span id="find-count" class="find-count"></span>
              <button id="opt-case" class="toggle" title="大文字小文字を区別 (Alt+C)">Aa</button>
              <button id="opt-word" class="toggle" title="単語単位 (Alt+W)">ab</button>
              <button id="opt-regex" class="toggle" title="正規表現 (Alt+R)">.*</button>
              <button id="find-prev" class="ico" title="前の一致 (Shift+F3)" aria-label="前の一致">
                <svg class="ay-icon"><use href="#i-up"></use></svg>
              </button>
              <button id="find-next" class="ico" title="次の一致 (F3)" aria-label="次の一致">
                <svg class="ay-icon"><use href="#i-down"></use></svg>
              </button>
              <button id="find-close" class="ico" title="検索を閉じる (Esc)" aria-label="検索を閉じる">×</button>
            </div>
            <div class="field replace-row" role="group" aria-label="置換">
              <input id="replace-input" type="text" autocomplete="off" placeholder="置換後" />
              <button id="replace-one" class="cmd replace-btn" title="現在の一致を置換して次へ">置換</button>
              <button id="replace-all" class="cmd replace-btn" title="すべての一致を置換 (元に戻せます)">すべて置換</button>
            </div>
          </div>
          <div id="overlay" class="overlay hidden"></div>
        </main>
      </div>

      <!-- Status bar keeps only the always-useful vitals, right-aligned like a
           normal editor; feedback (save results, errors, hints) lives on the
           left in #st-msg, the single visible home for operation messages. -->
      <footer id="statusbar">
        <span id="st-saving" class="seg saving-seg hidden" role="status">保存中…</span>
        <span id="st-msg" class="seg msg" role="status" aria-live="polite"></span>
        <div class="spacer"></div>
        <span id="st-pos" class="seg">—</span>
        <span id="st-edit" class="seg">—</span>
        <span id="st-enc" class="seg">—</span>
        <span id="st-eol" class="seg">—</span>
        <span id="st-index" class="seg dim">—</span>
      </footer>
    </div>

    <!-- File picker / welcome dialog. Shown at boot when no file is open, and
         on demand via the 開く button. -->
    <div id="opener" class="modal hidden" aria-hidden="true">
      <div class="modal-panel" role="dialog" aria-label="ファイルを開く">
        <div class="modal-head">
          <div class="modal-title">
            <img src="/favicon.svg" width="18" height="18" alt="" />
            <span id="opener-title">ファイルを開く</span>
          </div>
          <button id="opener-close" class="modal-x" title="閉じる (Esc)">✕</button>
        </div>

        <div class="opener-path">
          <span id="opener-input-label" class="opener-input-label">パス</span>
          <input id="opener-input" type="text" autocomplete="off" spellcheck="false"
                 placeholder="ファイルのパスを入力… (例: /var/log/huge.log)" />
          <button id="opener-folder" class="cmd" title="表示中のフォルダをツリーに開く">フォルダ</button>
          <button id="opener-open" class="cmd">開く</button>
        </div>

        <div id="opener-cwd" class="opener-cwd" title=""></div>
        <div id="opener-list" class="opener-list"></div>
        <div id="opener-msg" class="opener-msg"></div>

        <div id="opener-hint" class="opener-hint">
          ここへファイルをドラッグ＆ドロップしても開けます。大きなファイルはパス指定の方が高速です。
        </div>
      </div>
    </div>

    <!-- Settings: theme + font. Persisted in localStorage. -->
    <div id="settings" class="modal hidden" aria-hidden="true">
      <div class="modal-panel settings-panel" role="dialog" aria-label="設定">
        <div class="modal-head">
          <div class="modal-title">設定</div>
          <button id="settings-close" class="modal-x" title="閉じる (Esc)">✕</button>
        </div>
        <div class="settings-body">
          <label class="set-row">
            <span class="set-label">テーマ</span>
            <select id="set-theme">
              <option value="iris-light">Iris Light</option>
              <option value="iris-mist">Iris Mist</option>
              <option value="iris-dawn">Iris Dawn</option>
              <option value="sumi-light">Sumi Light</option>
              <option value="mono-paper">Mono Paper (単色)</option>
              <option value="dark">ダーク</option>
              <option value="black">ブラック</option>
            </select>
          </label>
          <label class="set-row">
            <span class="set-label">背景</span>
            <select id="set-bg">
              <option value="watercolor">水彩</option>
              <option value="solid">単色（全単色配慮）</option>
            </select>
          </label>
          <label class="set-row">
            <span class="set-label">イラスト</span>
            <input id="set-illus" type="range" min="0" max="100" step="5" />
            <span id="set-illus-val" class="set-val"></span>
          </label>
          <label class="set-row">
            <span class="set-label">フォント</span>
            <select id="set-font">
              <option value="mono">等幅 (Consolas / Menlo)</option>
              <option value="mono-jp">等幅 + 日本語 (Noto/MS Gothic)</option>
              <option value="system">システムUI</option>
            </select>
          </label>
          <label class="set-row">
            <span class="set-label">文字サイズ</span>
            <input id="set-fontsize" type="range" min="11" max="22" step="1" />
            <span id="set-fontsize-val" class="set-val"></span>
          </label>
          <label class="set-row">
            <span class="set-label">列ルーラー</span>
            <input id="set-ruler" type="checkbox" />
            <span class="set-val"></span>
          </label>
          <div class="set-row">
            <span class="set-label">サイドバー</span>
            <div class="seg-control" role="group" aria-label="サイドバー位置">
              <button type="button" id="set-sidebar-left" class="seg" data-sidebar-side="left">左</button>
              <button type="button" id="set-sidebar-right" class="seg" data-sidebar-side="right">右</button>
            </div>
          </div>
          <div class="set-row">
            <span class="set-label">キー設定</span>
            <button id="keymap-open" class="cmd">編集</button>
          </div>
          <div class="set-row">
            <span class="set-label">テーマJSON</span>
            <button id="theme-json-edit" class="cmd">タブで編集</button>
          </div>
        </div>
      </div>
    </div>

    <div id="keymap-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-panel keymap-panel" role="dialog" aria-label="キー設定">
        <div class="modal-head">
          <div class="modal-title">キー設定</div>
          <button id="keymap-close" class="modal-x" title="閉じる (Esc)">✕</button>
        </div>
        <div class="keymap-body">
          <div class="keymap-hint">入力欄を選んでキーを押すと変更できます。Backspace / Delete で未設定。</div>
          <div id="keymap-list" class="keymap-list"></div>
          <div class="keymap-actions">
            <button id="keymap-json-edit" class="cmd">JSONをタブで編集</button>
            <button id="keymap-reset" class="cmd">既定に戻す</button>
            <button id="keymap-done" class="cmd primary">閉じる</button>
          </div>
        </div>
      </div>
    </div>

    <div id="command-palette" class="modal hidden" aria-hidden="true">
      <div class="modal-panel palette-panel" role="dialog" aria-label="コマンドパレット">
        <div class="modal-head">
          <div class="modal-title">コマンドパレット</div>
          <button id="palette-close" class="modal-x" title="閉じる (Esc)">✕</button>
        </div>
        <div class="palette-body">
          <input id="palette-input" class="palette-input" autocomplete="off" spellcheck="false" />
          <div id="palette-list" class="palette-list" role="listbox"></div>
        </div>
      </div>
    </div>

    <div id="diff-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-panel diff-panel" role="dialog" aria-label="差分">
        <div class="modal-head">
          <div class="modal-title">差分</div>
          <button id="diff-close" class="modal-x" title="閉じる (Esc)">✕</button>
        </div>
        <div class="diff-body">
          <div id="diff-summary" class="diff-summary"></div>
          <div class="diff-paths">
            <div><span>現在</span><strong id="diff-old-path"></strong></div>
            <div><span>比較先</span><strong id="diff-new-path"></strong></div>
          </div>
          <div class="diff-grid-head">
            <span>現在のファイル</span>
            <span>比較先ファイル</span>
          </div>
          <div id="diff-view" class="diff-view"></div>
        </div>
      </div>
    </div>

    <!-- Generic small form dialog: sort / replace / case-save collect all of
         their options in one screen instead of chained prompts. -->
    <div id="form-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-panel form-panel" role="dialog" aria-label="オプション">
        <div class="modal-head">
          <div class="modal-title" id="form-title">オプション</div>
          <button id="form-close" class="modal-x" title="閉じる (Esc)">✕</button>
        </div>
        <div id="form-body" class="form-body"></div>
        <div class="form-actions">
          <button id="form-cancel" class="cmd">キャンセル</button>
          <button id="form-ok" class="cmd primary">実行</button>
        </div>
      </div>
    </div>

    <!-- Generic confirm / message dialog (replaces the browser's
         window.confirm and window.alert — no more "127.0.0.1 の内容"). -->
    <div id="confirm" class="modal hidden" aria-hidden="true">
      <div class="modal-panel confirm-panel" role="dialog" aria-label="確認">
        <div class="modal-head">
          <div class="modal-title" id="confirm-title">確認</div>
          <button id="confirm-close" class="modal-x" title="閉じる (Esc)">✕</button>
        </div>
        <div class="confirm-body">
          <div id="confirm-message" class="confirm-message"></div>
          <div class="confirm-actions">
            <button id="confirm-cancel" class="cmd">キャンセル</button>
            <button id="confirm-ok" class="cmd primary">OK</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Generic input prompt (replaces the browser's window.prompt). -->
    <div id="prompt" class="modal hidden" aria-hidden="true">
      <div class="modal-panel prompt-panel" role="dialog" aria-label="入力">
        <div class="modal-head">
          <div class="modal-title" id="prompt-title">入力</div>
          <button id="prompt-close" class="modal-x" title="閉じる (Esc)">✕</button>
        </div>
        <div class="prompt-body">
          <span class="prompt-label" id="prompt-label"></span>
          <input id="prompt-input" type="text" autocomplete="off" spellcheck="false" />
          <div class="prompt-actions">
            <button id="prompt-cancel" class="cmd">キャンセル</button>
            <button id="prompt-ok" class="cmd primary">OK</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Right-click context menu for the editor viewport. Selection-dependent
         items disable themselves; 選択箇所をファイルに保存 streams server-side
         so it is not limited by the clipboard cap. -->
    <div id="ctx-menu" class="file-menu ctx-menu hidden" role="menu" aria-label="コンテキストメニュー">
      <button class="menu-item" data-ctx="cut" role="menuitem"><span class="menu-label">切り取り</span><span class="menu-key" data-key-action="cut">Ctrl+X</span></button>
      <button class="menu-item" data-ctx="copy" role="menuitem"><span class="menu-label">コピー</span><span class="menu-key" data-key-action="copy">Ctrl+C</span></button>
      <button class="menu-item" data-ctx="paste" role="menuitem"><span class="menu-label">貼り付け</span><span class="menu-key">Ctrl+V</span></button>
      <div class="menu-sep" aria-hidden="true"></div>
      <button class="menu-item" data-ctx="selectAll" role="menuitem"><span class="menu-label">すべて選択</span><span class="menu-key" data-key-action="selectAll">Ctrl+A</span></button>
      <button class="menu-item" data-ctx="saveSelection" role="menuitem"
              title="選択した行だけを別ファイルへ書き出します。コピーの行数上限はありません">
        <span class="menu-label">選択箇所をファイルに保存…</span><span class="menu-key"></span>
      </button>
      <div class="menu-sep" aria-hidden="true"></div>
      <button class="menu-item" data-ctx="find" role="menuitem"><span class="menu-label">検索</span><span class="menu-key" data-key-action="find">Ctrl+F</span></button>
      <button class="menu-item" data-ctx="replace" role="menuitem"><span class="menu-label">置換</span><span class="menu-key" data-key-action="replace">Ctrl+H</span></button>
      <div class="menu-sep" aria-hidden="true"></div>
      <button class="menu-item" data-ctx="sortSave" role="menuitem"><span class="menu-label">ソート</span><span class="menu-key"></span></button>
      <button class="menu-item" data-ctx="diffFile" role="menuitem"><span class="menu-label">2ファイル差分</span><span class="menu-key"></span></button>
      <button class="menu-item" data-ctx="splitFile" role="menuitem"><span class="menu-label">ファイルを分割</span><span class="menu-key"></span></button>
    </div>

    <!-- Full-window drop hint, shown while dragging a file over the page. -->
    <div id="dropzone" class="dropzone hidden">
      <div class="dropzone-inner">ドロップしてファイルを開く</div>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
