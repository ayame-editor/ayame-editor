site_name: Ayame Editor Docs
site_description: Documentation for Ayame Editor, a desktop text editor for huge files.
site_url: https://hjosugi.github.io/ayame-editor/
repo_url: https://github.com/hjosugi/ayame-editor
repo_name: hjosugi/ayame-editor
edit_uri: edit/main/docs/

theme:
  name: mkdocs
  nav_style: light
  navigation_depth: 3
  highlightjs: true
  hljs_languages:
    - rust
    - powershell
    - yaml

plugins:
  - search:
      lang:
        - en
        - ja

markdown_extensions:
  - admonition
  - fenced_code
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/ayame-docs.css

hooks:
  - scripts/mkdocs_ayame_pages.py

nav:
  - Home: index.md
  - Using Ayame:
      - User Guide: USER_GUIDE.md
      - CLI Reference: CLI_REFERENCE.md
      - Migrating to ayame-diff: MIGRATING_TO_AYAME_DIFF.md
  - Internals:
      - Architecture: ARCHITECTURE.md
      - Data Integrity: DATA_INTEGRITY.md
  - Development:
      - Packaging: PACKAGING.md
      - Developer Guide: DEVELOPMENT.md
  - 日本語:
      - はじめに:
          - ホーム: ja/index.md
      - 使いかた:
          - ユーザー向け: ja/USER_GUIDE.md
          - CLI リファレンス: ja/CLI_REFERENCE.md
          - ayame-diff への移行: ja/MIGRATING_TO_AYAME_DIFF.md
      - しくみ:
          - アーキテクチャ: ja/ARCHITECTURE.md
          - データ完全性: ja/DATA_INTEGRITY.md
      - 開発・配布:
          - 配布: ja/PACKAGING.md
          - 開発者向け: ja/DEVELOPMENT.md
