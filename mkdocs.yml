site_name: Ayame Editor Docs
site_description: Documentation for Ayame Editor, a desktop text editor for huge files.
site_url: https://ayame-editor.github.io/ayame-editor/
repo_url: https://github.com/ayame-editor/ayame-editor
repo_name: hjosugi/ayame-editor
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            Home: ホーム
            Using Ayame: 使いかた
            User Guide: ユーザー向け
            CLI Reference: CLI リファレンス
            Internals: しくみ
            Architecture: アーキテクチャ
            Data Integrity: データ完全性
            Development: 開発・配布
            Packaging: 配布
            Developer Guide: 開発者向け

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/ayame-docs.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ayame-editor/ayame-editor

nav:
  - Home: index.md
  - Using Ayame:
      - User Guide: USER_GUIDE.md
      - CLI Reference: CLI_REFERENCE.md
  - Internals:
      - Architecture: ARCHITECTURE.md
      - Data Integrity: DATA_INTEGRITY.md
  - Development:
      - Packaging: PACKAGING.md
      - Developer Guide: DEVELOPMENT.md
