[workspace]
resolver = "2"
members = ["crates/ayame-core", "crates/ayame-cli", "xtask"]

[workspace.package]
version = "0.9.0"
edition = "2021"
# Minimum supported Rust version. The build.rs TS->JS transform depends on
# oxc 0.138, whose `oxc_transformer` uses `if let` match guards — stable only
# since Rust 1.95. oxc under-declares its own `rust-version` as 1.94.0, so on
# an older stable cargo can't warn and the build fails with a cryptic
# `error[E0658]: if let guards are experimental` deep inside the dependency
# (see #195). Declaring the real floor here makes cargo fail fast with a clear
# "requires rustc 1.95" message, and the `msrv` CI job gates it so a future
# dependency bump that raises the real minimum can't slip past the floating
# `stable` toolchain unnoticed.
rust-version = "1.95"
license = "0BSD"
repository = "https://github.com/ayame-editor/ayame-editor"

# One lint policy for every crate (each opts in with `[lints] workspace = true`).
# CI enforces `-D warnings` on top; these make debug leftovers unbuildable.
[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Every `unsafe` must state its contract. The engine's mmap sites are the ones
# that matter: a mapping can be invalidated by another process truncating the
# file, and each site has to say how that is absorbed rather than leaving the
# reasoning in nearby prose (#112).
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
memmap2 = "0.9"
memchr = "2"
encoding_rs = "0.8"
chardetng = "0.1"
regex = "1"
rayon = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml_edit = "0.25"
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
unicode-width = "0.2"
unicode_names2 = "3.1"
unicode-general-category = "1.1"
unicode-script = "0.5"
unicode-bidi = "0.3"
east-asian-width = "0.1"
sha2 = "0.10"

# Release builds favor raw throughput for the indexing/scan hot paths.
# Keep ayame-core at one codegen unit so ThinLTO sees the whole engine at once.
# NOTE: we deliberately do NOT set `panic = "abort"`: the web server isolates
# per-request panics by unwinding, which is part of the stability story.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"  # ~15% smaller binaries; release scripts no longer rely on a host `strip`

# ayame-cli is mostly CLI/server/UI orchestration around ayame-core. Compiling
# that much larger crate in parallel cuts release iteration time substantially
# without relaxing the engine's one-unit optimization policy (see #262).
[profile.release.package.ayame-cli]
codegen-units = 16
strip = "symbols"
