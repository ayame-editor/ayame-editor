[workspace]
resolver = "2"
members = ["crates/ayame-core", "crates/ayame-cli"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/hjosugi/ayame-editor"

[workspace.dependencies]
memmap2 = "0.9"
memchr = "2"
encoding_rs = "0.8"
chardetng = "0.1"
regex = "1"
rayon = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Release builds favor raw throughput for the indexing/scan hot paths.
# NOTE: we deliberately do NOT set `panic = "abort"`: the web server isolates
# per-request panics by unwinding, which is part of the stability story.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
