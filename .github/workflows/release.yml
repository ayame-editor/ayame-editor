name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: linux-x86_64-musl
            bin: ayame
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
            bin: ayame.exe
          - os: macos-13
            target: x86_64-apple-darwin
            suffix: macos-x86_64
            bin: ayame
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: macos-aarch64
            bin: ayame
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          fi
          mkdir -p dist
          src="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          out="dist/ayame-${tag}-${{ matrix.suffix }}"
          if [[ "${{ matrix.bin }}" == *.exe ]]; then
            out="${out}.exe"
          fi
          cp "$src" "$out"
          strip "$out" 2>/dev/null || true
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$out" > "$out.sha256"
          else
            shasum -a 256 "$out" > "$out.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ayame-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          fi
          cat dist/*.sha256 > dist/SHA256SUMS
          gh release view "$tag" >/dev/null 2>&1 && mode=upload || mode=create
          if [ "$mode" = create ]; then
            gh release create "$tag" dist/* \
              --title "$tag" \
              --target "$GITHUB_SHA" \
              --notes "Ayame ${tag}: standalone command-line binaries with embedded web assets."
          else
            gh release upload "$tag" dist/* --clobber
          fi
