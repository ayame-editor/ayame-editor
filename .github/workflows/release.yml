name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  actions: read
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Ayame ships as a native desktop app only (feature = "gui"): the editor +
  # the OS webview (WKWebView / WebView2 / WebKitGTK). The binary still contains
  # the full CLI engine (used internally by the app's workers), but we no longer
  # publish a separate CLI-only build. macOS ships an .app bundle; Linux needs
  # WebKitGTK at runtime; Windows/macOS use the built-in system webview.
  build:
    name: build ${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
            bin: ayame
            rustflags: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
            bin: ayame.exe
            rustflags: "-C target-feature=+crt-static"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: macos-x86_64
            bin: ayame
            rustflags: ""
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: macos-aarch64
            bin: ayame
            rustflags: ""
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --features gui --target "${{ matrix.target }}"
      - name: Verify Windows version metadata
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target/${{ matrix.target }}/release/${{ matrix.bin }}"
          $info = (Get-Item -LiteralPath $binary).VersionInfo
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.tag }}"
          } else {
            "${{ github.ref_name }}"
          }
          $expectedVersion = $tag.TrimStart("v")
          if ($info.ProductName -ne "Ayame Editor") {
            throw "Unexpected ProductName '$($info.ProductName)' in $binary"
          }
          if (-not $info.FileVersion.StartsWith($expectedVersion)) {
            throw "FileVersion '$($info.FileVersion)' does not match '$expectedVersion'"
          }
          if (-not $info.ProductVersion.StartsWith($expectedVersion)) {
            throw "ProductVersion '$($info.ProductVersion)' does not match '$expectedVersion'"
          }
      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          fi
          ver="${tag#v}"
          mkdir -p dist
          src="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          strip "$src" 2>/dev/null || true
          case "${{ matrix.suffix }}" in
            macos-*)
              app="Ayame.app"
              rm -rf "$app"
              mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
              cp "$src" "$app/Contents/MacOS/ayame"
              cp crates/ayame-cli/web/favicon.svg "$app/Contents/Resources/favicon.svg" || true
              # Dock/Finder icon: build Ayame.icns from the committed master PNG
              # with macOS-native tools (sips + iconutil).
              iconset="Ayame.iconset"
              rm -rf "$iconset"
              mkdir -p "$iconset"
              for sz in 16 32 128 256 512; do
                sips -z "$sz" "$sz" assets/icon-1024.png --out "$iconset/icon_${sz}x${sz}.png" >/dev/null
                dbl=$((sz * 2))
                sips -z "$dbl" "$dbl" assets/icon-1024.png --out "$iconset/icon_${sz}x${sz}@2x.png" >/dev/null
              done
              iconutil -c icns "$iconset" -o "$app/Contents/Resources/Ayame.icns"
              rm -rf "$iconset"
              printf '%s\n' \
                '<?xml version="1.0" encoding="UTF-8"?>' \
                '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
                '<plist version="1.0">' \
                '<dict>' \
                '  <key>CFBundleName</key><string>Ayame</string>' \
                '  <key>CFBundleDisplayName</key><string>Ayame</string>' \
                '  <key>CFBundleIdentifier</key><string>com.hjosugi.ayame</string>' \
                "  <key>CFBundleVersion</key><string>${ver}</string>" \
                "  <key>CFBundleShortVersionString</key><string>${ver}</string>" \
                '  <key>CFBundleExecutable</key><string>ayame</string>' \
                '  <key>CFBundleIconFile</key><string>Ayame</string>' \
                '  <key>CFBundlePackageType</key><string>APPL</string>' \
                '  <key>LSMinimumSystemVersion</key><string>10.13</string>' \
                '  <key>NSHighResolutionCapable</key><true/>' \
                '</dict>' \
                '</plist>' > "$app/Contents/Info.plist"
              out="dist/ayame-${tag}-${{ matrix.suffix }}.zip"
              ditto -c -k --keepParent "$app" "$out"
              rm -rf "$app"
              ;;
            windows-*)
              out="dist/ayame-${tag}-${{ matrix.suffix }}.exe"
              cp "$src" "$out"
              ;;
            *)
              out="dist/ayame-${tag}-${{ matrix.suffix }}"
              cp "$src" "$out"
              ;;
          esac
          out_dir="$(dirname "$out")"
          out_name="$(basename "$out")"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$out_dir" && sha256sum "$out_name") > "$out.sha256"
          else
            (cd "$out_dir" && shasum -a 256 "$out_name") > "$out.sha256"
          fi

      # SignPath Foundation provides free cloud code signing for accepted OSS
      # projects. The unsigned Windows executable must first be stored as a
      # GitHub Actions artifact so SignPath can verify its build provenance.
      # With no SIGNPATH_* secrets this lane remains fully backward-compatible
      # and publishes the existing unsigned executable. A partial configuration
      # fails explicitly instead of silently publishing something unexpected.
      - name: Resolve SignPath configuration
        id: signpath
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $names = @(
            "SIGNPATH_API_TOKEN",
            "SIGNPATH_ORGANIZATION_ID",
            "SIGNPATH_PROJECT_SLUG",
            "SIGNPATH_SIGNING_POLICY_SLUG"
          )
          $missing = @($names | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          if ($missing.Count -eq $names.Count) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "SignPath is not configured; publishing the unsigned Windows executable."
          } elseif ($missing.Count -gt 0) {
            throw "Incomplete SignPath configuration; missing: $($missing -join ', ')"
          } else {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Stage unsigned Windows executable for SignPath
        id: signpath-unsigned
        if: runner.os == 'Windows' && steps.signpath.outputs.enabled == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ayame-signpath-unsigned-${{ matrix.target }}
          path: dist/*.exe
          if-no-files-found: error

      - name: Sign Windows executable with SignPath
        if: runner.os == 'Windows' && steps.signpath.outputs.enabled == 'true'
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.signpath-unsigned.outputs.artifact-id }}
          github-token: ${{ github.token }}
          wait-for-completion: true
          output-artifact-directory: signpath/signed

      - name: Replace Windows executable with signed artifact
        if: runner.os == 'Windows' && steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $destination = @(Get-ChildItem -Path dist -Filter *.exe)
          $signed = @(Get-ChildItem -Path signpath/signed -Filter *.exe -Recurse)
          if ($destination.Count -ne 1) {
            throw "Expected exactly one staged Windows executable, found $($destination.Count)."
          }
          if ($signed.Count -ne 1) {
            throw "Expected exactly one SignPath-signed executable, found $($signed.Count)."
          }
          Copy-Item -LiteralPath $signed[0].FullName -Destination $destination[0].FullName -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $destination[0].FullName).Hash.ToLowerInvariant()
          "$hash  $($destination[0].Name)" |
            Out-File -FilePath "$($destination[0].FullName).sha256" -Encoding ascii

      - uses: actions/upload-artifact@v6
        with:
          name: ayame-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          fi
          cat dist/*.sha256 > dist/SHA256SUMS
          gh release view "$tag" >/dev/null 2>&1 && mode=upload || mode=create
          if [ "$mode" = create ]; then
            gh release create "$tag" dist/* \
              --title "$tag" \
              --target "$GITHUB_SHA" \
              --notes "Ayame ${tag}: native desktop app (Windows .exe, macOS .app, Linux binary). Linux needs WebKitGTK at runtime; Windows/macOS use the built-in system webview. Code signing policy: https://github.com/hjosugi/ayame-editor/blob/main/docs/PACKAGING.md#windows-code-signing"
          else
            gh release upload "$tag" dist/* --clobber
          fi
