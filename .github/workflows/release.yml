name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Ayame ships as a native desktop app only (feature = "gui"): the editor +
  # the OS webview (WKWebView / WebView2 / WebKitGTK). The binary still contains
  # the full CLI engine (used internally by the app's workers), but we no longer
  # publish a separate CLI-only build. macOS ships an .app bundle; Linux needs
  # WebKitGTK at runtime; Windows/macOS use the built-in system webview.
  build:
    name: build ${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
            bin: ayame
            rustflags: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
            bin: ayame.exe
            rustflags: "-C target-feature=+crt-static"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: macos-x86_64
            bin: ayame
            rustflags: ""
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: macos-aarch64
            bin: ayame
            rustflags: ""
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust 1.94.1 stable
        shell: bash
        run: |
          rustup toolchain install 1.94.1 --profile minimal --target "${{ matrix.target }}"
          rustup default 1.94.1
      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --features gui --target "${{ matrix.target }}"
      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          fi
          ver="${tag#v}"
          mkdir -p dist
          src="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          strip "$src" 2>/dev/null || true
          case "${{ matrix.suffix }}" in
            macos-*)
              app="Ayame.app"
              rm -rf "$app"
              mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
              cp "$src" "$app/Contents/MacOS/ayame"
              cp crates/ayame-cli/web/favicon.svg "$app/Contents/Resources/favicon.svg" || true
              # Dock/Finder icon: build Ayame.icns from the committed master PNG
              # with macOS-native tools (sips + iconutil).
              iconset="Ayame.iconset"
              rm -rf "$iconset"
              mkdir -p "$iconset"
              for sz in 16 32 128 256 512; do
                sips -z "$sz" "$sz" assets/icon-1024.png --out "$iconset/icon_${sz}x${sz}.png" >/dev/null
                dbl=$((sz * 2))
                sips -z "$dbl" "$dbl" assets/icon-1024.png --out "$iconset/icon_${sz}x${sz}@2x.png" >/dev/null
              done
              iconutil -c icns "$iconset" -o "$app/Contents/Resources/Ayame.icns"
              rm -rf "$iconset"
              printf '%s\n' \
                '<?xml version="1.0" encoding="UTF-8"?>' \
                '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
                '<plist version="1.0">' \
                '<dict>' \
                '  <key>CFBundleName</key><string>Ayame</string>' \
                '  <key>CFBundleDisplayName</key><string>Ayame</string>' \
                '  <key>CFBundleIdentifier</key><string>com.hjosugi.ayame</string>' \
                "  <key>CFBundleVersion</key><string>${ver}</string>" \
                "  <key>CFBundleShortVersionString</key><string>${ver}</string>" \
                '  <key>CFBundleExecutable</key><string>ayame</string>' \
                '  <key>CFBundleIconFile</key><string>Ayame</string>' \
                '  <key>CFBundlePackageType</key><string>APPL</string>' \
                '  <key>LSMinimumSystemVersion</key><string>10.13</string>' \
                '  <key>NSHighResolutionCapable</key><true/>' \
                '</dict>' \
                '</plist>' > "$app/Contents/Info.plist"
              out="dist/ayame-${tag}-${{ matrix.suffix }}.zip"
              ditto -c -k --keepParent "$app" "$out"
              rm -rf "$app"
              ;;
            windows-*)
              out="dist/ayame-${tag}-${{ matrix.suffix }}.exe"
              cp "$src" "$out"
              ;;
            *)
              out="dist/ayame-${tag}-${{ matrix.suffix }}"
              cp "$src" "$out"
              ;;
          esac
          out_dir="$(dirname "$out")"
          out_name="$(basename "$out")"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$out_dir" && sha256sum "$out_name") > "$out.sha256"
          else
            (cd "$out_dir" && shasum -a 256 "$out_name") > "$out.sha256"
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: ayame-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Sign checksums
        shell: bash
        env:
          AYAME_UPDATE_SIGNING_KEY: ${{ secrets.AYAME_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AYAME_UPDATE_SIGNING_KEY:-}" ]; then
            echo "AYAME_UPDATE_SIGNING_KEY is required for signed updates" >&2
            exit 1
          fi
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          printf '%s' "$AYAME_UPDATE_SIGNING_KEY" > "$key"
          for checksum in dist/*.sha256; do
            openssl pkeyutl -sign -rawin -inkey "$key" \
              -in "$checksum" -out "$checksum.sig.bin"
            od -An -v -tx1 "$checksum.sig.bin" | tr -d ' \n' > "$checksum.sig"
            rm -f "$checksum.sig.bin"
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          fi
          cat dist/*.sha256 > dist/SHA256SUMS
          gh release view "$tag" >/dev/null 2>&1 && mode=upload || mode=create
          if [ "$mode" = create ]; then
            gh release create "$tag" dist/* \
              --title "$tag" \
              --target "$GITHUB_SHA" \
              --notes "Ayame ${tag}: native desktop app (Windows .exe, macOS .app, Linux binary). Linux needs WebKitGTK at runtime; Windows/macOS use the built-in system webview."
          else
            gh release upload "$tag" dist/* --clobber
          fi
