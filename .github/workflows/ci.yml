name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  # Regression guard for #195: compile on the exact declared MSRV instead of
  # relying on the floating stable toolchain used by the other Rust jobs.
  msrv:
    name: msrv (rust 1.95)
    runs-on: ubuntu-latest
    env:
      MSRV: "1.95.0"
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust ${{ env.MSRV }}
        run: |
          rustup toolchain install "$MSRV" --profile minimal
          rustup default "$MSRV"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: cargo check on MSRV
        run: cargo check --workspace --locked

  rust-format:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install rustfmt
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt
      - run: cargo fmt --all --check

  rust-clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install clippy
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - run: cargo clippy --all-targets --locked -- -D warnings

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - run: cargo test --locked

  type-bindings:
    name: Rust / TypeScript bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - run: cargo run --locked -p ayame-cli --features typegen -- typegen --check

  server-only:
    name: Server-only feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: Clippy
        run: cargo clippy --locked -p ayame-cli --all-targets --no-default-features -- -D warnings
      - name: Test
        run: cargo test --locked -p ayame-cli --no-default-features
      - name: Release build
        run: cargo build --release --locked -p ayame-cli --no-default-features
      - name: Dependency guard
        run: |
          if cargo tree --locked -p ayame-cli --no-default-features --edges normal --prefix none \
            | grep -Eq '^(reqwest|rustls|sha2|zip) v'; then
            echo "server-only build unexpectedly includes the self-update dependency stack"
            exit 1
          fi

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/ayame-cli/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/ayame-cli/web/package-lock.json
      - run: npm ci
      - name: Circular imports
        run: npm run cycles
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Format
        run: npm run fmt:check
      - name: Lint
        run: npm run lint

  linux-release:
    name: Linux release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - run: cargo build --release --locked

  gui-build:
    name: GUI release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - run: cargo build --release --locked --features gui

  gui-clippy:
    name: GUI clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable and clippy
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy
      - name: Install webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - run: cargo clippy --all-targets --locked --features gui -- -D warnings

  windows-metadata:
    name: Windows executable metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: Build Windows executable
        run: cargo build --release --locked -p ayame-cli
      - name: Verify SignPath metadata
        shell: pwsh
        run: |
          $binary = "target/release/ayame.exe"
          $info = (Get-Item -LiteralPath $binary).VersionInfo
          $metadata = cargo metadata --format-version 1 --no-deps |
            ConvertFrom-Json
          $expectedVersion = (
            $metadata.packages |
              Where-Object { $_.name -eq "ayame-cli" }
          ).version
          if ($info.ProductName -ne "Ayame Editor") {
            throw "Unexpected ProductName '$($info.ProductName)' in $binary"
          }
          if (-not $info.FileVersion.StartsWith($expectedVersion)) {
            throw "FileVersion '$($info.FileVersion)' does not match '$expectedVersion'"
          }
          if (-not $info.ProductVersion.StartsWith($expectedVersion)) {
            throw "ProductVersion '$($info.ProductVersion)' does not match '$expectedVersion'"
          }
