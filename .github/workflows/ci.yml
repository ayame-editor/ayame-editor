name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Regression guard for #195. The `test` job installs the *floating* `stable`
  # toolchain, which is always fresh enough to build, so it can never catch
  # "we actually require a newer Rust than we admit to." This job pins the
  # declared MSRV (Cargo.toml `rust-version`) and compiles the whole workspace
  # — including ayame-cli's build.rs, which pulls oxc — on exactly that
  # toolchain. If a dependency bump raises the real minimum above the declared
  # floor, this fails and forces a conscious `rust-version` bump instead of
  # silently stranding contributors on a slightly older stable.
  msrv:
    name: msrv (rust 1.95)
    runs-on: ubuntu-latest
    env:
      MSRV: "1.95.0"
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust ${{ env.MSRV }}
        run: |
          rustup toolchain install "$MSRV" --profile minimal
          rustup default "$MSRV"
      # Keep this in lockstep with the declared MSRV: `cargo check` compiles the
      # library, binaries, and build scripts (so oxc_transformer is exercised)
      # without linking, which is enough to surface an E0658-class MSRV break.
      - name: cargo check on MSRV
        run: cargo check --workspace --locked

  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all --check
      # All frontend tooling (tsc, vitest, oxfmt, oxlint) is pinned in
      # web/package-lock.json and installed once here, so CI, the release gate,
      # and local dev run byte-identical versions. No ad-hoc binary downloads or
      # floating `npx` versions that drift and turn CI red without a code change.
      - name: Install frontend deps
        run: npm ci --prefix crates/ayame-cli/web
      - name: Frontend type check
        run: npm run typecheck --prefix crates/ayame-cli/web
      - name: Frontend unit tests
        run: npm test --prefix crates/ayame-cli/web
      - name: Frontend format + lint (oxfmt / oxlint)
        run: |
          npm run fmt:check --prefix crates/ayame-cli/web
          npm run lint --prefix crates/ayame-cli/web
      # Rust <-> TypeScript type sharing (typeship): the committed api.d.ts
      # must match what the serve types generate.
      - name: Type bindings drift check
        run: cargo run --locked -p ayame-cli --features typegen -- typegen --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      # `self-update` is default-on for release binaries, but server-only
      # deployments must compile and test without reqwest/rustls/zip/sha2.
      - name: Clippy (server-only, no default features)
        run: cargo clippy --locked -p ayame-cli --all-targets --no-default-features -- -D warnings
      - name: Test (server-only, no default features)
        run: cargo test --locked -p ayame-cli --no-default-features
      - name: Release build (server-only, no default features)
        run: cargo build --release --locked -p ayame-cli --no-default-features
      - name: Server-only dependency guard
        run: |
          if cargo tree --locked -p ayame-cli --no-default-features --edges normal --prefix none \
            | grep -Eq '^(reqwest|rustls|sha2|zip) v'; then
            echo "server-only build unexpectedly includes the self-update dependency stack"
            exit 1
          fi
      # The desktop app is the product: don't let the gui feature rot until
      # release day.
      - name: Install webview deps (gui feature)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - name: Release build
        run: cargo build --release --locked
      - name: Release build (gui feature)
        run: cargo build --release --locked --features gui
      - name: Clippy (gui feature)
        run: cargo clippy --all-targets --locked --features gui -- -D warnings

  windows-metadata:
    name: Windows executable metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build Windows executable
        run: cargo build --release --locked -p ayame-cli
      - name: Verify SignPath metadata
        shell: pwsh
        run: |
          $binary = "target/release/ayame.exe"
          $info = (Get-Item -LiteralPath $binary).VersionInfo
          $metadata = cargo metadata --format-version 1 --no-deps |
            ConvertFrom-Json
          $expectedVersion = (
            $metadata.packages |
              Where-Object { $_.name -eq "ayame-cli" }
          ).version
          if ($info.ProductName -ne "Ayame Editor") {
            throw "Unexpected ProductName '$($info.ProductName)' in $binary"
          }
          if (-not $info.FileVersion.StartsWith($expectedVersion)) {
            throw "FileVersion '$($info.FileVersion)' does not match '$expectedVersion'"
          }
          if (-not $info.ProductVersion.StartsWith($expectedVersion)) {
            throw "ProductVersion '$($info.ProductVersion)' does not match '$expectedVersion'"
          }
