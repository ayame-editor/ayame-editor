name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Frontend syntax
        run: node --check crates/ayame-cli/web/app.js
      # oxc toolchain (Rust-native single binaries, no Node toolchain needed).
      # Version-pinned so formatting is reproducible; bump deliberately.
      - name: Frontend format + lint (oxfmt / oxlint)
        run: |
          set -euo pipefail
          OXC_TAG="apps_v1.72.0"
          for tool in oxfmt oxlint; do
            curl -sL -o "/tmp/$tool.tar.gz" \
              "https://github.com/oxc-project/oxc/releases/download/${OXC_TAG}/${tool}-x86_64-unknown-linux-gnu.tar.gz"
            tar -xzf "/tmp/$tool.tar.gz" -C /tmp
            chmod +x "/tmp/${tool}-x86_64-unknown-linux-gnu"
          done
          /tmp/oxfmt-x86_64-unknown-linux-gnu --check crates/ayame-cli/web/app.js
          /tmp/oxlint-x86_64-unknown-linux-gnu --max-warnings 0 crates/ayame-cli/web/app.js
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      # The desktop app is the product: don't let the gui feature rot until
      # release day.
      - name: Install webview deps (gui feature)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - name: Release build
        run: cargo build --release --locked
      - name: Release build (gui feature)
        run: cargo build --release --locked --features gui
      - name: Clippy (gui feature)
        run: cargo clippy --all-targets --locked --features gui -- -D warnings
