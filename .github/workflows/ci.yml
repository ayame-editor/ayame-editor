name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust 1.94.1 stable
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.94.1
      - name: Format
        run: cargo fmt --all --check
      # All frontend tooling (tsc, vitest, oxfmt, oxlint) is pinned in
      # web/package-lock.json and installed once here, so CI, the release gate,
      # and local dev run byte-identical versions. No ad-hoc binary downloads or
      # floating `npx` versions that drift and turn CI red without a code change.
      - name: Install frontend deps
        run: npm ci --prefix crates/ayame-cli/web
      - name: Frontend type check
        run: npm run typecheck --prefix crates/ayame-cli/web
      - name: Frontend unit tests
        run: npm test --prefix crates/ayame-cli/web
      - name: Frontend format + lint (oxfmt / oxlint)
        run: |
          npm run fmt:check --prefix crates/ayame-cli/web
          npm run lint --prefix crates/ayame-cli/web
      # Rust <-> TypeScript type sharing (typeship): the committed api.d.ts
      # must match what the serve types generate.
      - name: Type bindings drift check
        run: cargo run --locked -p ayame-cli --features typegen -- typegen --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      # The desktop app is the product: don't let the gui feature rot until
      # release day.
      - name: Install webview deps (gui feature)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - name: Release build
        run: cargo build --release --locked
      - name: Release build (gui feature)
        run: cargo build --release --locked --features gui
      - name: Clippy (gui feature)
        run: cargo clippy --all-targets --locked --features gui -- -D warnings
